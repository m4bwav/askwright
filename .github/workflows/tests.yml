# Checks the skill's structure, links and public-safety guards, runs the ask.py tests and the size budget on the
# three operating systems with the oldest and newest Python supported, and the page tests in Chrome on Linux.
name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.14"]
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: skill, links, LF endings and the key and path guards
        run: python tests/check_skills.py
      - name: ask.py tests (lint, server contract, Range, tokens, status and read)
        run: python tests/test_ask.py
      - name: size budget
        run: python scripts/budget.py
  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: install Playwright (the runner's own Chrome plays H.264)
        run: python -m pip install playwright
      - name: page tests in Chrome with axe-core
        run: python tests/test_page.py
